name: Android Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast first-class gate: unit + Robolectric integration tests.
  unit-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Both channels (play/github flavors): each has its own face-model and update code.
      - name: Run unit + integration (Robolectric) tests
        run: ./gradlew testPlayDebugUnitTest testGithubDebugUnitTest

      - name: Run release script tests (Play upload, update.json)
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore

  # On-device integration tests on an Android emulator.
  instrumented-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 29 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedPlayDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemblePlayDebug assembleGithubDebug

      - name: Verify debug APKs exist
        run: |
          for channel in play github; do
            APK="app/build/outputs/apk/$channel/debug/app-$channel-debug.apk"
            test -s "$APK"
            ls -lh "$APK"
          done

      - name: Run release lint (hard gate)
        run: ./gradlew :app:lintPlayRelease :app:lintGithubRelease

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-release
          path: app/build/reports/lint-results-*Release.html
          if-no-files-found: ignore

      # What each channel ships: the Play AAB and the GitHub APK (unsigned here).
      - name: Build release artifacts with R8 (hard gate, unsigned ok)
        run: ./gradlew :app:bundlePlayRelease :app:assembleGithubRelease

      - name: Verify release artifacts exist and are non-empty
        run: |
          AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"
          APK="$(ls app/build/outputs/apk/github/release/*.apk | head -1)"
          test -s "$APK"
          ls -lh "$APK"

      # R8 full mode once dropped the no-arg constructors of ML Kit's component
      # registrars (created by reflection), so "베베컵에게 맡기기" failed in every
      # release build v0.7.1-v0.10.0 while debug builds worked. proguard-rules.pro
      # keeps them; this checks both channels.
      - name: Verify R8 kept reflectively created constructors (ML Kit, TensorFlow Lite)
        run: |
          for f in github play; do
            SEEDS="app/build/outputs/mapping/${f}Release/seeds.txt"
            for r in vision.face.internal.FaceRegistrar vision.common.internal.VisionCommonRegistrar common.internal.CommonComponentRegistrar; do
              NAME="${r##*.}"
              grep -qx "com.google.mlkit.$r: $NAME()" "$SEEDS" || { echo "::error::$f release: R8 dropped $NAME()"; exit 1; }
            done
          done
          # TensorFlow Lite runtime for 아이 얼굴 구분, also created by reflection.
          grep -qx "org.tensorflow.lite.InterpreterFactoryImpl: InterpreterFactoryImpl()" app/build/outputs/mapping/githubRelease/seeds.txt             || { echo "::error::github release: R8 dropped InterpreterFactoryImpl()"; exit 1; }
          grep -qx "com.google.android.gms.tflite.InterpreterFactoryImpl: InterpreterFactoryImpl()" app/build/outputs/mapping/playRelease/seeds.txt             || { echo "::error::play release: R8 dropped InterpreterFactoryImpl()"; exit 1; }

      - name: Upload R8 mapping artifact (build job)
        uses: actions/upload-artifact@v7
        with:
          name: bebecup-r8-mapping
          path: app/build/outputs/mapping/*Release/mapping.txt
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: bebecup-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Two keys, one per channel (DECISIONS.md, "채널별 빌드"):
      # BEBECUP_RELEASE_* = Google Play upload key, BEBECUP_GITHUB_* = GitHub APK key.
      - name: Restore release keystores
        env:
          BEBECUP_RELEASE_KEYSTORE_BASE64: ${{ secrets.BEBECUP_RELEASE_KEYSTORE_BASE64 }}
          BEBECUP_GITHUB_KEYSTORE_BASE64: ${{ secrets.BEBECUP_GITHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$BEBECUP_RELEASE_KEYSTORE_BASE64"
          test -n "$BEBECUP_GITHUB_KEYSTORE_BASE64"
          mkdir -p release
          printf '%s' "$BEBECUP_RELEASE_KEYSTORE_BASE64" | base64 -d > release/bebecup-release.p12
          printf '%s' "$BEBECUP_GITHUB_KEYSTORE_BASE64" | base64 -d > release/bebecup-github-release.p12
          test -s release/bebecup-release.p12
          test -s release/bebecup-github-release.p12

      - name: Run tests
        run: ./gradlew testPlayDebugUnitTest testGithubDebugUnitTest

      - name: Build signed GitHub APK and Play Console AAB
        env:
          BEBECUP_RELEASE_STORE_FILE: release/bebecup-release.p12
          BEBECUP_RELEASE_STORE_PASSWORD: ${{ secrets.BEBECUP_RELEASE_STORE_PASSWORD }}
          BEBECUP_RELEASE_KEY_ALIAS: ${{ secrets.BEBECUP_RELEASE_KEY_ALIAS }}
          BEBECUP_RELEASE_KEY_PASSWORD: ${{ secrets.BEBECUP_RELEASE_KEY_PASSWORD }}
          BEBECUP_GITHUB_STORE_FILE: release/bebecup-github-release.p12
          BEBECUP_GITHUB_STORE_PASSWORD: ${{ secrets.BEBECUP_GITHUB_STORE_PASSWORD }}
          BEBECUP_GITHUB_KEY_ALIAS: ${{ secrets.BEBECUP_GITHUB_KEY_ALIAS }}
          BEBECUP_GITHUB_KEY_PASSWORD: ${{ secrets.BEBECUP_GITHUB_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_bebecup.requireReleaseSigning: "true"
        run: ./gradlew :app:assembleGithubRelease :app:bundlePlayRelease

      - name: Verify R8 kept reflectively created constructors (ML Kit, TensorFlow Lite)
        run: |
          for f in github play; do
            SEEDS="app/build/outputs/mapping/${f}Release/seeds.txt"
            for r in vision.face.internal.FaceRegistrar vision.common.internal.VisionCommonRegistrar common.internal.CommonComponentRegistrar; do
              NAME="${r##*.}"
              grep -qx "com.google.mlkit.$r: $NAME()" "$SEEDS" || { echo "::error::$f release: R8 dropped $NAME()"; exit 1; }
            done
          done
          # TensorFlow Lite runtime for 아이 얼굴 구분, also created by reflection.
          grep -qx "org.tensorflow.lite.InterpreterFactoryImpl: InterpreterFactoryImpl()" app/build/outputs/mapping/githubRelease/seeds.txt             || { echo "::error::github release: R8 dropped InterpreterFactoryImpl()"; exit 1; }
          grep -qx "com.google.android.gms.tflite.InterpreterFactoryImpl: InterpreterFactoryImpl()" app/build/outputs/mapping/playRelease/seeds.txt             || { echo "::error::play release: R8 dropped InterpreterFactoryImpl()"; exit 1; }

      # Public certificate fingerprints, so a swapped secret cannot ship a
      # wrongly signed build (docs/RELEASE.md).
      - name: Verify release signing certificates
        env:
          GITHUB_APK_SHA256: 8734b582f9be30b6f11b33ac608f82b4e599adc870da7a0fbbc7c456f1807966
          PLAY_UPLOAD_SHA256: "05:01:95:78:3E:88:0F:19:04:DF:91:4D:EA:5A:BE:20:1E:79:BE:84:47:25:C7:23:60:BD:45:A3:B0:C3:51:B7"
        run: |
          APK="app/build/outputs/apk/github/release/app-github-release.apk"
          AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify "$APK"
          # The prefix differs between apksigner versions ("Signer #1 ...", "Signer (minSdkVersion=...) ..."),
          # so take the first certificate SHA-256 line whatever precedes it.
          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)"
          echo "GitHub APK signer: $APK_SHA"
          test "$APK_SHA" = "$GITHUB_APK_SHA256"
          AAB_SHA="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^\s*SHA256: //p' | head -1)"
          echo "Play AAB signer: $AAB_SHA"
          test "$AAB_SHA" = "$PLAY_UPLOAD_SHA256"

      - name: Prepare release assets (GitHub APK + its R8 mapping)
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "bebecup-${GITHUB_REF_NAME}.apk"
          MAPPING="app/build/outputs/mapping/githubRelease/mapping.txt"
          test -s "$MAPPING"
          cp "$MAPPING" "bebecup-${GITHUB_REF_NAME}.mapping.txt"
          ls -lh "bebecup-${GITHUB_REF_NAME}.apk" "bebecup-${GITHUB_REF_NAME}.mapping.txt"

      # Read by the GitHub build's updater (GithubUpdateManifest): it fetches
      # releases/latest/download/update.json and builds the APK URL itself from
      # this repository, "v" + versionName and "apk", so versionName must equal the tag.
      - name: Prepare update.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          CODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          [ "$NAME" = "$VERSION" ] || { echo "::error::versionName $NAME does not match tag $GITHUB_REF_NAME"; exit 1; }
          test -n "$CODE"
          python3 scripts/update_manifest.py "$CODE" "$VERSION" "bebecup-${GITHUB_REF_NAME}.apk" update.json
          cat update.json

      - name: Upload Play Console AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: bebecup-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      # The Play build's own mapping (the GitHub Release one is the GitHub APK's).
      - name: Upload R8 mapping artifact (release job)
        uses: actions/upload-artifact@v7
        with:
          name: bebecup-release-mapping
          path: app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            BEGIN { heading = "## v" version }
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " " || substr($0, length(heading) + 1, 1) == "-") {
              sub(/^## /, "")
              sub(/ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/, "")
              print
              exit
            }
          ' CHANGELOG.md > release-title.txt
          test -s release-title.txt
          awk -v version="$VERSION" '
            BEGIN { heading = "## v" version }
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " " || substr($0, length(heading) + 1, 1) == "-") {
              found = 1; next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "bebecup-${GITHUB_REF_NAME}.apk" \
            "bebecup-${GITHUB_REF_NAME}.mapping.txt" \
            update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md

  # Uploads the Play-signed AAB to Google Play (closed testing - Alpha) via the
  # Play Developer Publishing API. Separate job so a Play failure can be re-run on
  # its own without touching the GitHub release. Skips with a warning until the
  # PLAY_SERVICE_ACCOUNT_JSON secret exists. Always the alpha track; production is
  # only reachable from scripts/play_upload.py with --allow-production.
  play-alpha:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check Play service account secret
        id: key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning title=Play upload skipped::PLAY_SERVICE_ACCOUNT_JSON secret is not set. Upload manually or add the secret and re-run this job (docs/RELEASE.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Download Play Console AAB
        if: steps.key.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: bebecup-release-aab
          path: play

      - name: Download R8 mapping
        if: steps.key.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: bebecup-release-mapping
          path: play

      - name: Install Play upload dependencies
        if: steps.key.outputs.enabled == 'true'
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-play.txt

      - name: Upload to Google Play (alpha)
        if: steps.key.outputs.enabled == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Repository variable; unset means draft (release from Play Console after review).
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          CODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$CODE"
          python3 scripts/play_upload.py \
            --aab play/app-play-release.aab \
            --mapping play/mapping.txt \
            --version-code "$CODE" \
            --notes-dir fastlane/metadata/android \
            --track alpha \
            --status "$PLAY_RELEASE_STATUS"
