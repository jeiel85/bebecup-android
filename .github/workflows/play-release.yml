name: Play Release (manual)

# Manual path to Google Play, next to the automatic one (android-build.yml
# "play-alpha", runs on every v* tag push). Use it to
#   - check the Play setup without uploading (dry_run: true, the default):
#     builds the signed Play AAB from tag v<version>, checks its upload
#     certificate, validates the upload inputs and reads the Play tracks;
#   - re-upload a version to alpha when the tag run's play-alpha job can no
#     longer be re-run (its AAB artifact expired) — dry_run: false.
# Only workflow_dispatch, so a tag push never starts this workflow and the same
# version is not uploaded twice by CI. Play itself rejects a versionCode that
# was already uploaded. Details: docs/RELEASE.md "자동 업로드".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without v (tag v<version> must exist), e.g. 0.13.0"
        required: true
        type: string
      dry_run:
        description: "Only build, verify and read tracks (no upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    # Holds PLAY_SERVICE_ACCOUNT_JSON; a reviewer approves each run in the Actions page.
    environment: play
    concurrency:
      group: play-upload
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check version input
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1; }

      # The app is built from the release tag; the upload script comes from the
      # commit this workflow runs on, so script fixes apply to older tags too.
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Checkout CI scripts
        uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: scripts

      - name: Check versionName matches tag
        run: |
          NAME="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          CODE="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          [ "$NAME" = "$VERSION" ] || { echo "::error::versionName $NAME does not match v$VERSION"; exit 1; }
          test -n "$CODE"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "v$VERSION = versionCode $CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Repository secret (the upload key password exists only there, issue #4).
      - name: Restore Play upload keystore
        env:
          BEBECUP_RELEASE_KEYSTORE_BASE64: ${{ secrets.BEBECUP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$BEBECUP_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$BEBECUP_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/bebecup-release.p12"
          test -s "$RUNNER_TEMP/keys/bebecup-release.p12"

      - name: Run Play unit tests
        run: ./gradlew testPlayDebugUnitTest

      - name: Build signed Play AAB
        env:
          BEBECUP_RELEASE_STORE_FILE: ${{ runner.temp }}/keys/bebecup-release.p12
          BEBECUP_RELEASE_STORE_PASSWORD: ${{ secrets.BEBECUP_RELEASE_STORE_PASSWORD }}
          BEBECUP_RELEASE_KEY_ALIAS: ${{ secrets.BEBECUP_RELEASE_KEY_ALIAS }}
          BEBECUP_RELEASE_KEY_PASSWORD: ${{ secrets.BEBECUP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease

      # Same pinned value as android-build.yml and docs/RELEASE.md (Play upload key).
      - name: Verify Play upload certificate
        env:
          PLAY_UPLOAD_SHA256: "05:01:95:78:3E:88:0F:19:04:DF:91:4D:EA:5A:BE:20:1E:79:BE:84:47:25:C7:23:60:BD:45:A3:B0:C3:51:B7"
        run: |
          AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"
          AAB_SHA="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^\s*SHA256: //p' | head -1)"
          echo "Play AAB signer: $AAB_SHA"
          test "$AAB_SHA" = "$PLAY_UPLOAD_SHA256"
          test -s app/build/outputs/mapping/playRelease/mapping.txt

      - name: Install Play upload dependencies
        run: python3 -m pip install --disable-pip-version-check -r ci/scripts/requirements-play.txt

      - name: Upload to Google Play (alpha)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS=(--dry-run); fi
          python3 ci/scripts/play_upload.py \
            --aab app/build/outputs/bundle/playRelease/app-play-release.aab \
            --mapping app/build/outputs/mapping/playRelease/mapping.txt \
            --version-code "$VERSION_CODE" \
            --notes-dir fastlane/metadata/android \
            --track alpha \
            --status "$PLAY_RELEASE_STATUS" \
            "${ARGS[@]}"

      - name: Show Play tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 ci/scripts/play_upload.py --show-tracks

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
